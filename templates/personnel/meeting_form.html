<!-- templates/personnel/meeting_form.html -->
{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-calendar-plus"></i> 
                    {% if form.instance.pk %}
                        Edit Meeting: {{ form.instance.name }}
                    {% else %}
                        Create New Meeting
                    {% endif %}
                </h3>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if form.instance.pk %}Update{% else %}Create{% endif %} Meeting
                        </button>
                        <a href="{% url 'personnel-dashboard-table' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
